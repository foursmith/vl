name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v[0-9]+.*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version-file: go.mod
      - run: make check
      - name: Build and check the archives
        shell: bash
        run: |
          version=0.0.0-dev
          if [[ "$GITHUB_REF_TYPE" == tag ]]; then
            version=${GITHUB_REF_NAME#v}
          fi
          bash scripts/package-release.sh "$version"
          (cd dist && sha256sum -c checksums.txt)

          stage=$(mktemp -d)
          trap 'rm -rf "$stage"' EXIT
          for platform in darwin-amd64 darwin-arm64 linux-amd64 linux-arm64 windows-amd64 windows-arm64; do
            destination="$stage/$platform"
            mkdir "$destination"
            arch=${platform#*-}
            if [[ $arch == amd64 ]]; then
              arch=x86_64
            fi
            archive="dist/vl_${version}_${platform%-*}_${arch}"
            binary="$destination/vl"
            if [[ $platform == windows-* ]]; then
              unzip -q "$archive.zip" -d "$destination"
              binary+=.exe
            else
              tar -xzf "$archive.tar.gz" -C "$destination"
            fi
            metadata=$(go version -m "$binary")
            grep -q "GOOS=${platform%-*}$" <<< "$metadata"
            grep -q "GOARCH=${platform#*-}$" <<< "$metadata"
            test -s "$destination/LICENSE"
            test -s "$destination/THIRD_PARTY_NOTICES.md"
            test -s "$destination/licenses/go/LICENSE"
          done

          binary="$stage/linux-amd64/vl"
          test "$("$binary" -version)" = "vl $version"
          "$binary" preview --color=never --lines=1 cmd/vl/main.go > "$stage/preview"
          grep -qx 'package main' "$stage/preview"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vl-release
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/install.sh
            dist/install.ps1
            dist/checksums.txt
          if-no-files-found: error

  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          path: dist
          name: vl-release
      - name: Assemble the draft release
        working-directory: dist
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          sha256sum -c checksums.txt
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft); then
            test "$draft" = true
          else
            args=(--verify-tag --draft --title "$tag" --generate-notes)
            if [[ "$tag" == *-* ]]; then
              args+=(--prerelease)
            fi
            gh release create "$tag" "${args[@]}"
          fi
          gh release upload "$tag" vl_*.tar.gz vl_*.zip install.sh install.ps1 checksums.txt --clobber
